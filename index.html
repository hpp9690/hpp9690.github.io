<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="全球主要市场行业与热门主题涨跌雷达">
  <title>全球板块雷达</title>
  <link rel="preconnect" href="https://qt.gtimg.cn" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="logo">↗</span><div><b>全球板块雷达</b><small>GLOBAL SECTOR RADAR</small></div></div>
      <div class="actions"><label class="search"><span>⌕</span><input id="search" placeholder="搜索板块、股票或代码"></label><button id="refresh" class="refresh">↻ <span>刷新</span></button></div>
    </header>

    <nav id="marketNav" class="markets" aria-label="市场切换"></nav>

    <section class="hero">
      <div><p id="session" class="eyebrow"></p><h1 id="title">A股板块全景</h1><p id="coverage" class="coverage"></p></div>
      <div id="status" class="status"><i></i><div><b>正在同步行情</b><small>等待首次更新</small></div></div>
    </section>

    <section id="stats" class="stats"></section>

    <section class="panel">
      <div class="panel-head"><div><span>SECTOR MAP</span><h2>板块热力图</h2></div><div class="controls"><div id="kindFilter" class="segments"><button data-kind="all" class="active">全部</button><button data-kind="industry">行业</button><button data-kind="theme">主题</button></div><button id="sort">按强弱排序</button></div></div>
      <div id="error" class="error" hidden></div>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden>没有匹配的板块或股票</div>
    </section>

    <footer><span>行情源：腾讯行情 · 可能存在延迟</span><span>红涨绿跌 · 仅供市场观察，不构成投资建议</span></footer>
  </main>

  <div id="modal" class="modal-wrap" hidden><section class="modal" role="dialog" aria-modal="true"><button id="closeModal" class="close" aria-label="关闭">×</button><div id="modalContent"></div></section></div>

  <script src="market-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
